spring:
  application:
    name: consumer
  cloud:
    loadbalancer:
      cache:
        # Wyłącza dodatkowy cache instancji po stronie LoadBalancera.
        # Eureka DiscoveryClient posiada własny mechanizm cache.
        enabled: false
server:
  port: 8080

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
management:
  endpoint:
    shutdown:
      enabled: true
  endpoints:
    web:
      exposure:
        include: shutdown