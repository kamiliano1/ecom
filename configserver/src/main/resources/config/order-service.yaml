spring:
  datasource:
    #    url: ${DB_URL}
    #    username: ${DB_USERNAME}
    #    password: ${DB_PASSWORD}
    url: jdbc:postgresql://localhost:5432/order
    username: kamil
    password: kamil
  jpa:
    database: POSTGRESQL
    show-sql: true
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true
  cloud:
    stream:
      bindings:
        createOrder-out-0:
          destination: order.exchange
          content-type: application/json
      rabbit:
        bindings:
          createOrder-out-0:
            producer:
              routing-key-expression: '''order.tracking'''
server:
  port: 8083
app:
  message: "Hello World!"
resilience4j:
  circuitbreaker:
    instances:
      productService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        automaticTransitionFromOpenToHalfOpenEnabled: true
        slidingWindowType: count_based
  #        https://resilience4j.readme.io/docs/circuitbreaker#create-and-configure-a-circuitbreaker
  retry:
    instances:
      retryBreaker:
        maxAttempts: 5
        waitDuration: 500ms
      #https://resilience4j.readme.io/docs/retry
  #      exampleRetry:
  #        maxAttempts: 3
  #        waitDuration: 500ms
  #        intervalFunction:
  #          type: exponential
  #          initialInterval: 500ms
  #          multiplier: 1.5
  #          maxInterval: 5s
  #        retryExceptions:
  #          - java.io.IOException
  #          - java.sql.SQLException
  #        ignoreExceptions:
  #          - com.example.exception.NonRetriableException
  #        failAfterMaxAttempts: false
  ratelimiter:
    instances:
      rateLimiterBreaker:
        timeout-duration: 0
        #        2 api allowed during 4 seconds
        limit-refresh-period: 4s
        limit-for-period: 2
#        https://resilience4j.readme.io/docs/ratelimiter

# RabbitMQ

rabbitmq:
  exchange:
    name: order.exchange
  queue:
    name: order.queue
  routing:
    key: order.tracking