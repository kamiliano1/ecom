server:
  port: 8084
rabbitmq:
  exchange:
    name: order.exchange
  queue:
    name: order.queue
  routing:
    key: order.tracking
spring:
  cloud:
    stream:
      functions:
        definition: orderCreated
      bindings:
        orderCreated-in-0:
          destination: order.exchange-
          group: notification-group
          content-type: application/json
    function:
      definition: orderCreated