spring:
  application:
    name: provider
server:
  port: 8081

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    # Eureka rejestruje adres IP instancji zamiast używać hostname'u,
    # np. 172.21.144.1 zamiast DESKTOP-G2MFUNI.mshome.net.
    prefer-ip-address: true